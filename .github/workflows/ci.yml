name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Page script syntax
        run: |
          awk '/static let source = #"""/{f=1;next} /^    """#/{f=0} f' Sources/safari/PageAgent.swift > /tmp/agent.js
          node --check /tmp/agent.js
      - name: Smoke test
        run: Tests/smoke.sh
